    <script>
        const OWNER = 'hyeonho4ko'; 
        const REPO = 'hyeonho4ko.github.io'; 
        
        const urlParams = new URLSearchParams(window.location.search);
        const label = urlParams.get('label');
        const postListContainer = document.getElementById('post-list');

        if (label) {
            document.getElementById('category-title').innerText = label;
            fetchPosts(label);
        }

        async function fetchPosts(labelName) {
            const CACHE_KEY = `github_list_${labelName}`;
            const TIME_KEY = `github_time_list_${labelName}`;
            const CACHE_TTL = 10 * 60 * 1000; // 10분

            try {
                let issues;
                const cachedData = localStorage.getItem(CACHE_KEY);
                const lastFetch = localStorage.getItem(TIME_KEY);
                const now = new Date().getTime();

                if (cachedData && lastFetch && (now - lastFetch < CACHE_TTL)) {
                    issues = JSON.parse(cachedData);
                } else {
                    const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/issues?labels=${encodeURIComponent(labelName)}&state=open`;
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) {
                        throw new Error(`GitHub API 에러: ${response.status} (${response.statusText})<br>계정명(${OWNER})이나 저장소명(${REPO})이 올바른지 확인하세요.`);
                    }
                    issues = await response.json();
                    
                    localStorage.setItem(CACHE_KEY, JSON.stringify(issues));
                    localStorage.setItem(TIME_KEY, now.toString());
                }

                postListContainer.innerHTML = ''; 

                if (issues.length === 0) {
                    postListContainer.innerHTML = `<div style="text-align:center; padding:50px;">
                        <p>'<b>${labelName}</b>' 레이블이 달린 Open된 글이 없습니다.</p>
                        <p style="font-size:0.9rem; color:grey;">GitHub Issues에서 해당 글에 레이블을 추가했는지 확인하세요.</p>
                    </div>`;
                    return;
                }

                issues.forEach(issue => {
                    const date = new Date(issue.created_at).toLocaleDateString();
                    const postElement = document.createElement('a');
                    postElement.href = `post.html?id=${issue.number}`;
                    postElement.className = 'post-item';
                    postElement.innerHTML = `
                        <h3>${issue.title}</h3>
                        <div style="color:#7f8c8d; font-size:0.85rem;">작성일: ${date}</div>
                    `;
                    postListContainer.appendChild(postElement);
                });

            } catch (error) {
                postListContainer.innerHTML = `<div class="error-msg">
                    <strong>오류 발생:</strong><br>${error.message}
                </div>`;
            }
        }
    </script>
