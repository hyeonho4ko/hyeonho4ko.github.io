<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post List</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 0 auto; padding: 40px 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; border-bottom: 3px solid #2980b9; padding-bottom: 10px; }
        .post-item { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.3s; display: block; text-decoration: none; color: inherit; }
        .post-item:hover { transform: translateX(10px); background: #f9f9f9; }
        .post-title { font-size: 1.2rem; font-weight: bold; color: #2980b9; margin-bottom: 5px; }
        .post-date { font-size: 0.8rem; color: #999; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
    <h1 id="category-name">Loading...</h1>
    <div id="post-list"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const label = urlParams.get('label');
        const repo = "hyeonho4ko/hyeonho4ko.github.io";

        document.getElementById('category-name').innerText = label + " Articles";

        if (label) {
            // GitHub API에서 해당 라벨의 Issue 목록 가져오기
            fetch(`https://api.github.com/repos/${repo}/issues?labels=${label}`)
                .then(res => res.json())
                .then(posts => {
                    const listDiv = document.getElementById('post-list');
                    if (posts.length === 0) {
                        listDiv.innerHTML = "<p>No articles found in this category yet.</p>";
                        return;
                    }
                    posts.forEach(post => {
                        const date = new Date(post.created_at).toLocaleDateString();
                        const item = document.createElement('a');
                        item.className = 'post-item';
                        // 여기서 우리가 만든 post.html로 연결합니다!
                        item.href = `post.html?id=${post.number}`;
                        item.innerHTML = `
                            <div class="post-title">${post.title}</div>
                            <div class="post-date">${date}</div>
                        `;
                        listDiv.appendChild(item);
                    });
                });
        }
    </script>
</body>
</html>
