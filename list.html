<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post List - Hyeonho's Archive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .back-home { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2980b9; font-weight: bold; }
        .list-header { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #2980b9; }
        .list-header h1 { margin: 0; color: #2c3e50; font-size: 1.8rem; }
        #post-list { min-height: 200px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Back to Archive</a>
    
    <div class="list-header">
        <h1 id="category-title">Loading...</h1>
        <p>Selected category posts.</p>
    </div>

    <div id="post-list">
        <!-- 이곳에 포스트 목록이 생성됩니다 -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const label = urlParams.get('label');
        if (label) {
            // URL의 label 파라미터(예: Epidemiology Reference Study)를 제목으로 표시
            document.getElementById('category-title').innerText = label;
            document.title = `${label} - Hyeonho's Archive`;
        }
    </script>
</body>
</html>
