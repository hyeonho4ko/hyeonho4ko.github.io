<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - Hyeonho's Archive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .back-home { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2980b9; font-weight: bold; }
        .list-header { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #2980b9; }
        .post-item { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #eee; display: block; text-decoration: none; color: inherit; transition: 0.2s; }
        .post-item:hover { border-color: #2980b9; transform: translateX(5px); }
        .post-item h3 { margin: 0 0 5px 0; color: #2980b9; }
        .post-date { font-size: 0.85rem; color: #7f8c8d; }
        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Back to Archive</a>
    <div class="list-header"><h1 id="title">Loading...</h1></div>
    <div id="posts-container"><div class="loading">Fetching posts...</div></div>

    <script>
        const OWNER = 'hyeonho4ko'; 
        const REPO = 'hyeonho4ko.github.io';
        const params = new URLSearchParams(window.location.search);
        const label = params.get('label');

        document.getElementById('title').innerText = label || "All Posts";

        async function loadPosts() {
            const container = document.getElementById('posts-container');
            try {
                // API 호출: 레이블이 있으면 해당 레이블만, 없으면 전체 호출
                const url = `https://api.github.com/repos/${OWNER}/${REPO}/issues?state=open${label ? `&labels=${encodeURIComponent(label)}` : ''}`;
                const response = await fetch(url);
                const issues = await response.json();

                container.innerHTML = '';
                if (issues.length === 0) {
                    container.innerHTML = '<p style="text-align:center">작성된 글이 없습니다.</p>';
                    return;
                }

                issues.forEach(issue => {
                    const date = new Date(issue.created_at).toLocaleDateString();
                    container.innerHTML += `
                        <a href="post.html?id=${issue.number}" class="post-item">
                            <h3>${issue.title}</h3>
                            <span class="post-date">Published on ${date}</span>
                        </a>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p>글을 불러오는데 실패했습니다.</p>';
            }
        }
        loadPosts();
    </script>
</body>
</html>
