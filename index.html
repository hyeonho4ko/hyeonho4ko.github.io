    <script>
        const OWNER = 'hyeonho4ko';
        const REPO = 'hyeonho4ko.github.io';
        
        async function distributeRecentPosts() {
            const CACHE_KEY = 'github_issues_all';
            const TIME_KEY = 'github_issues_time';
            const CACHE_TTL = 10 * 60 * 1000; // 10분(밀리초)

            try {
                let issues;
                const cachedData = localStorage.getItem(CACHE_KEY);
                const lastFetch = localStorage.getItem(TIME_KEY);
                const now = new Date().getTime();

                // 10분이 지나지 않았고 캐시가 있다면 API 호출 생략
                if (cachedData && lastFetch && (now - lastFetch < CACHE_TTL)) {
                    issues = JSON.parse(cachedData);
                    console.log("인덱스 페이지: 캐시된 데이터 사용");
                } else {
                    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues?state=open&per_page=100`);
                    if (!response.ok) throw new Error('API Error');
                    issues = await response.json();
                    
                    // 새 데이터 캐싱
                    localStorage.setItem(CACHE_KEY, JSON.stringify(issues));
                    localStorage.setItem(TIME_KEY, now.toString());
                    console.log("인덱스 페이지: GitHub API 새로 호출");
                }
                
                const buckets = { 'English': [], 'EpiRef': [], 'EpiDesign': [], 'Medical': [], 'AI': [], 'Travel': [] };
                const counts = { 'English': 0, 'EpiRef': 0, 'EpiDesign': 0, 'Medical': 0, 'AI': 0, 'Travel': 0 };

                issues.forEach(issue => {
                    if (issue.pull_request) return;
                    const labelNames = issue.labels.map(l => l.name);

                    if (labelNames.includes('English')) { counts['English']++; if(buckets['English'].length < 3) buckets['English'].push(issue); }
                    if (labelNames.includes('Epidemiology Reference Study')) { counts['EpiRef']++; if(buckets['EpiRef'].length < 3) buckets['EpiRef'].push(issue); }
                    if (labelNames.includes('Epidemiology Study Design')) { counts['EpiDesign']++; if(buckets['EpiDesign'].length < 3) buckets['EpiDesign'].push(issue); }
                    if (labelNames.includes('Medical') || labelNames.includes('Medical Device')) { counts['Medical']++; if(buckets['Medical'].length < 3) buckets['Medical'].push(issue); }
                    if (labelNames.includes('AI') || labelNames.includes('AITool')) { counts['AI']++; if(buckets['AI'].length < 3) buckets['AI'].push(issue); }
                    if (labelNames.includes('Travel')) { counts['Travel']++; if(buckets['Travel'].length < 3) buckets['Travel'].push(issue); }
                });

                Object.keys(buckets).forEach(cat => {
                    document.getElementById(`count-${cat}`).innerText = counts[cat];
                    const moreBtn = document.getElementById(`more-${cat}`);
                    if (moreBtn && counts[cat] > 3) moreBtn.style.display = 'inline-block';
                    const container = document.getElementById(`list-${cat}`);

                    if (buckets[cat].length === 0) {
                        container.innerHTML = '<li class="empty-text">No posts found.</li>';
                    } else {
                        container.innerHTML = buckets[cat].map(issue => 
                            `<li class="mini-item"><a href="post.html?id=${issue.number}">• ${issue.title}</a></li>`
                        ).join('');
                    }
                });
            } catch (e) { 
                console.error(e); 
            }
        }

        async function fetchMedicalNews() {
            // (이전 코드와 동일하므로 그대로 유지)
            const newsContainer = document.getElementById('list-News');
            const updateLabel = document.getElementById('news-update-label');
            const CACHE_KEY = 'medical_news_data';
            const TIME_KEY = 'medical_news_timestamp';
            const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
            
            const cachedData = localStorage.getItem(CACHE_KEY);
            const lastUpdate = localStorage.getItem(TIME_KEY);
            const now = new Date().getTime();

            if (cachedData && lastUpdate && (now - lastUpdate < TWENTY_FOUR_HOURS)) {
                renderNews(JSON.parse(cachedData));
                const hoursLeft = Math.round((TWENTY_FOUR_HOURS - (now - lastUpdate)) / (1000 * 60 * 60));
                updateLabel.innerText = `Updates in approx. ${hoursLeft}h`;
                return;
            }

            const keywords = '"Medical Device" (Regulatory OR Quality OR AI OR "EU AI Act" OR QMSR OR PCCP OR SaMD) (USA OR UK OR Korea OR Germany OR FDA OR MHRA OR MFDS OR EMA) when:7d';
            const query = encodeURIComponent(keywords);
            const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=en-US&gl=US&ceid=US:en`;
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (data.status === 'ok') {
                    const items = data.items.slice(0, 5);
                    localStorage.setItem(CACHE_KEY, JSON.stringify(items));
                    localStorage.setItem(TIME_KEY, now.toString());
                    renderNews(items);
                    updateLabel.innerText = "Just Updated";
                }
            } catch (e) { 
                if (cachedData) {
                    renderNews(JSON.parse(cachedData));
                } else {
                    newsContainer.innerHTML = '<li class="empty-text">Failed to load news.</li>';
                }
            }
        }

        function renderNews(items) {
            const newsContainer = document.getElementById('list-News');
            newsContainer.innerHTML = items.map(item => 
                `<li class="mini-item"><a href="${item.link}" target="_blank">📰 ${item.title}</a></li>`
            ).join('');
        }

        distributeRecentPosts();
        fetchMedicalNews();
    </script>
