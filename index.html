<style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
    header { text-align: center; padding: 60px 0; background: #2c3e50; color: white; border-radius: 12px; margin-bottom: 40px; }
    .header-link { text-decoration: none; color: inherit; display: block; cursor: pointer; }
    header h1 { margin: 0; font-size: 2.5rem; }
    header p { opacity: 0.8; font-weight: 300; margin-top: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; border: 1px solid #eee; height: 320px; position: relative; }
    .card:hover { transform: translateY(-5px); border-color: #2980b9; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
    
    .card-title { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
    .card-title a { text-decoration: none; color: #2980b9; flex-grow: 1; font-weight: bold; }
    
    .post-count { font-size: 0.7rem; color: #95a5a6; border: 1px solid #d5dbdb; padding: 0; border-radius: 4px; font-weight: 500; margin-left: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
    .post-count a { display: block; padding: 2px 8px; text-decoration: none; color: inherit; transition: 0.2s; }
    
    .card-desc { font-size: 0.85rem; color: #7f8c8d; margin-top: 0; margin-bottom: 15px; }
    
    .list-label { font-size: 0.75rem; font-weight: bold; color: #bdc3c7; margin-bottom: 8px; display: flex; align-items: center; text-transform: uppercase; letter-spacing: 0.05em; }
    .list-label::before { content: "🕒"; margin-right: 5px; font-size: 0.8rem; }
    .mini-post-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow: hidden; }
    .mini-item { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; font-size: 0.95rem; }
    .mini-item a { text-decoration: none; color: #444; }
    
    .more-link { font-size: 0.8rem; color: #2980b9; text-decoration: none; font-weight: bold; display: none; margin-top: 5px; }
    .empty-text { font-size: 0.85rem; color: #aaa; font-style: italic; padding-top: 10px; text-align: center; }
    
    .admin-footer { display: flex; justify-content: flex-end; margin-top: 40px; padding: 20px 0; border-top: 1px solid #eee; }
    .btn-admin { padding: 8px 16px; background: #2c3e50; color: white; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }

    /* 모바일 가독성 최적화 (768px 이하) */
    @media (max-width: 768px) {
        body { padding: 10px 15px; background-color: #ffffff; }
        header { padding: 30px 15px; margin-bottom: 25px; border-radius: 8px; }
        header h1 { font-size: 1.8rem; }
        .grid { gap: 15px; display: block; } /* 그리드 대신 세로 나열 */
        .card { height: auto; padding: 20px 15px; margin-bottom: 15px; box-shadow: none; border: 1px solid #e0e0e0; border-radius: 8px; }
        .card:hover { transform: none; box-shadow: none; border-color: #e0e0e0; } /* 모바일에서 불필요한 호버 제거 */
        .mini-post-list { overflow: visible; }
        .mini-item { white-space: normal; line-height: 1.5; padding-bottom: 5px; border-bottom: 1px dashed #f0f0f0; margin-bottom: 10px; }
        .mini-item:last-child { border-bottom: none; }
    }
</style>
