<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hyeonho's Archive</title>
    <!-- 마크다운 변환 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav a { text-decoration: none; color: #2980b9; font-weight: bold; }
        
        article { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .post-title { color: #2c3e50; font-size: 2rem; margin-top: 0; margin-bottom: 10px; line-height: 1.3; }
        .meta { color: #7f8c8d; font-size: 0.9rem; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        #content img { max-width: 100%; border-radius: 8px; }
        
        /* 댓글 섹션 스타일 */
        .comments-section { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .comments-header { font-size: 1.4rem; color: #2c3e50; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; }
        .comment-item { border-bottom: 1px solid #eee; padding: 20px 0; }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { font-weight: bold; color: #2980b9; margin-right: 10px; }
        .comment-date { font-size: 0.85rem; color: #7f8c8d; }
        .comment-body { margin-top: 10px; font-size: 0.95rem; }
        
        /* 댓글 달기 버튼 */
        .btn-comment { display: block; text-align: center; margin-top: 30px; padding: 15px; background: #2c3e50; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
        .btn-comment:hover { background: #1a252f; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">← Home</a>
        <a href="javascript:history.back()">Back to List</a>
    </div>

    <!-- 본문 영역 -->
    <article>
        <h1 id="post-title" class="post-title">Loading post...</h1>
        <div id="post-meta" class="meta">Date</div>
        <div id="content"></div>
    </article>

    <!-- 댓글 영역 -->
    <div class="comments-section">
        <h3 class="comments-header">Comments (<span id="comment-count">0</span>)</h3>
        <div id="comments-list">
            <p style="color:#7f8c8d; text-align:center;">댓글을 불러오는 중입니다...</p>
        </div>
        <!-- GitHub 해당 이슈의 댓글창으로 바로 연결되는 버튼 -->
        <a id="btn-write-comment" href="#" target="_blank" class="btn-comment" style="display:none;">GitHub에서 댓글 작성하기</a>
    </div>

    <script>
        const OWNER = 'hyeonho4ko';
        const REPO = 'hyeonho4ko.github.io';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadPost() {
            try {
                // 1. 본문 데이터 가져오기
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues/${id}`);
                const issue = await response.json();

                document.title = issue.title;
                document.getElementById('post-title').innerText = issue.title;
                document.getElementById('post-meta').innerText = `Posted on ${new Date(issue.created_at).toLocaleDateString()} | Comments: ${issue.comments}`;
                document.getElementById('content').innerHTML = marked.parse(issue.body || "내용이 없습니다.");

                // 2. 댓글 설정
                document.getElementById('comment-count').innerText = issue.comments;
                
                const btnWrite = document.getElementById('btn-write-comment');
                btnWrite.href = issue.html_url + "#issue-comment-box"; // GitHub 댓글 입력창으로 바로가기 앵커
                btnWrite.style.display = 'block';

                const commentsList = document.getElementById('comments-list');
                
                // 3. 댓글이 있는 경우 댓글 내용 가져오기
                if (issue.comments > 0) {
                    const commentsRes = await fetch(issue.comments_url);
                    const commentsData = await commentsRes.json();
                    
                    commentsList.innerHTML = ''; // 로딩 문구 삭제
                    
                    commentsData.forEach(comment => {
                        commentsList.innerHTML += `
                            <div class="comment-item">
                                <div>
                                    <span class="comment-author">@${comment.user.login}</span>
                                    <span class="comment-date">${new Date(comment.created_at).toLocaleString()}</span>
                                </div>
                                <div class="comment-body">${marked.parse(comment.body)}</div>
                            </div>
                        `;
                    });
                } else {
                    commentsList.innerHTML = '<p style="color:#7f8c8d; text-align:center;">아직 작성된 댓글이 없습니다. 첫 번째 댓글을 남겨보세요!</p>';
                }

            } catch (e) {
                document.getElementById('content').innerText = "글을 불러올 수 없습니다.";
                document.getElementById('comments-list').innerHTML = "댓글을 불러올 수 없습니다.";
            }
        }

        if (id) loadPost();
    </script>
</body>
</html>
