<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hyeonho's Archive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .nav-buttons { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .btn-nav { text-decoration: none; color: #2980b9; font-weight: bold; }
        article { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .post-title { color: #2c3e50; margin-top: 0; font-size: 2rem; }
        .post-meta { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .tag { display: inline-block; background: #ebf5fb; color: #2980b9; padding: 2px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <a href="index.html" class="btn-nav">← Home</a>
        <a href="javascript:history.back()" class="btn-nav">Back to List</a>
    </div>

    <article>
        <h1 id="post-title" class="post-title">Post Title</h1>
        <div class="post-meta">
            <span id="post-date">Date</span> | <span id="post-category" class="tag">Category</span>
        </div>
        <div id="post-content">
            <!-- 상세 본문 -->
        </div>
    </article>
</body>
</html>
