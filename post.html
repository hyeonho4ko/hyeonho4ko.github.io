<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hyeonho's Archive</title>
    <!-- 마크다운 변환 라이브러리 (Marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 코드 하이라이팅 (Highlight.js) - 소스코드 가독성용 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* 기본 디자인 시스템 계승 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.7; 
            color: #333; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #f4f7f6; 
        }

        /* 상단 네비게이션 */
        .nav-header { margin-bottom: 30px; }
        .back-link { 
            text-decoration: none; 
            color: #666; 
            font-weight: bold;
            transition: color 0.3s;
        }
        .back-link:hover { color: #2980b9; }

        /* 게시글 영역 */
        article { 
            background: white; 
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .post-meta { color: #999; font-size: 0.9rem; margin-bottom: 10px; }
        h1 { color: #2c3e50; font-size: 2.5rem; margin-top: 0; line-height: 1.2; }
        
        /* 마크다운 스타일링 (중요) */
        #post-content { margin-top: 30px; font-size: 1.1rem; color: #444; }
        #post-content h2, #post-content h3 { color: #2c3e50; margin-top: 40px; }
        #post-content img { max-width: 100%; border-radius: 8px; }
        #post-content code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        #post-content pre { background: #f8f8f8; padding: 15px; border-radius: 8px; overflow-x: auto; }
        #post-content blockquote { border-left: 5px solid #2980b9; padding-left: 20px; color: #666; font-style: italic; margin: 20px 0; }

        /* 댓글 영역 */
        #comments-container { margin-top: 50px; }
    </style>
</head>
<body>

    <nav class="nav-header">
        <a href="javascript:history.back()" class="back-link">← Back to List</a>
    </nav>

    <article>
        <div id="post-meta" class="post-meta">Loading information...</div>
        <h1 id="post-title">Loading post...</h1>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        <div id="post-content">
            <p>Content is being fetched from GitHub...</p>
        </div>
    </article>

    <!-- 개별 게시글용 댓글창 -->
    <div id="comments-container">
        <script src="https://utteranc.es/client.js"
                repo="hyeonho4ko/hyeonho4ko.github.io"
                issue-term="pathname"
                theme="github-light"
                crossorigin="anonymous"
                async>
        </script>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const repo = "hyeonho4ko/hyeonho4ko.github.io";

        if (postId) {
            // 1. GitHub API를 통해 단일 Issue 데이터 가져오기
            fetch(`https://api.github.com/repos/${repo}/issues/${postId}`)
                .then(res => res.json())
                .then(post => {
                    // 제목과 메타정보 업데이트
                    document.getElementById('post-title').innerText = post.title;
                    document.title = post.title + " - Hyeonho's Archive";
                    
                    const date = new Date(post.created_at).toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    document.getElementById('post-meta').innerText = `Published on ${date} · Issue #${post.number}`;

                    // 2. 마크다운 본문을 HTML로 변환
                    const contentHtml = marked.parse(post.body || "No content found.");
                    document.getElementById('post-content').innerHTML = contentHtml;

                    // 3. 코드 하이라이팅 적용
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('post-content').innerHTML = "Failed to load post content.";
                });
        }
    </script>
</body>
</html>
