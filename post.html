<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hyeonho's Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary-color: #2980b9; --text-color: #333; --bg-color: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Apple SD Gothic Neo, sans-serif; line-height: 1.8; color: var(--text-color); max-width: 900px; margin: 0 auto; padding: 40px 20px; background-color: var(--bg-color); word-break: break-word; }
        .nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .nav a { text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 0.95rem; transition: opacity 0.2s; }
        .nav a:hover { opacity: 0.7; }
        article { background: var(--card-bg); padding: 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .post-title { color: #2c3e50; font-size: 2.4rem; margin-top: 0; margin-bottom: 15px; line-height: 1.2; letter-spacing: -0.02em; }
        .meta { color: #7f8c8d; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 25px; margin-bottom: 35px; }
        #content { font-size: 1.1rem; }
        #content img { max-width: 100%; border-radius: 8px; height: auto; display: block; margin: 20px auto; }
        #content code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        #content pre { background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 8px; overflow-x: auto; }
        #content blockquote { border-left: 5px solid var(--primary-color); margin-left: 0; padding-left: 20px; color: #555; font-style: italic; }
        .comments-section { background: var(--card-bg); padding: 40px 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 60px; }
        .comments-header { font-size: 1.5rem; color: #2c3e50; border-bottom: 2px solid var(--bg-color); padding-bottom: 15px; margin-top: 0; margin-bottom: 30px; }
        .utterances { max-width: 100% !important; width: 100% !important; }
        @media (max-width: 600px) { article, .comments-section { padding: 25px; } .post-title { font-size: 1.8rem; } }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">← Home Archive</a>
        <a href="javascript:history.back()">Back to List</a>
    </div>
    
    <article>
        <h1 id="post-title" class="post-title">Loading post...</h1>
        <div id="post-meta" class="meta">Date</div>
        <div id="content"></div>
    </article>
    
    <div class="comments-section">
        <h3 class="comments-header">Discussion</h3>
        <div id="utterances-container"></div>
    </div>
    
    <script>
        const OWNER = 'hyeonho4ko';
        const REPO = 'hyeonho4ko.github.io';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadPost() {
            if (!id) {
                document.getElementById('content').innerHTML = "잘못된 접근입니다.";
                return;
            }

            const CACHE_KEY = `github_post_${id}`;
            const TIME_KEY = `github_time_post_${id}`;
            const CACHE_TTL = 10 * 60 * 1000; // 10분

            try {
                let issue;
                const cachedData = localStorage.getItem(CACHE_KEY);
                const lastFetch = localStorage.getItem(TIME_KEY);
                const now = new Date().getTime();

                if (cachedData && lastFetch && (now - lastFetch < CACHE_TTL)) {
                    issue = JSON.parse(cachedData);
                } else {
                    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues/${id}`);
                    if (!response.ok) throw new Error("API Limit or Post not found");
                    issue = await response.json();
                    
                    localStorage.setItem(CACHE_KEY, JSON.stringify(issue));
                    localStorage.setItem(TIME_KEY, now.toString());
                }
                
                document.title = `${issue.title} - Hyeonho's Archive`;
                document.getElementById('post-title').innerText = issue.title;
                
                const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
                const formattedDate = new Date(issue.created_at).toLocaleDateString('en-US', dateOptions);
                document.getElementById('post-meta').innerText = `Published on ${formattedDate}`;
                
                document.getElementById('content').innerHTML = marked.parse(issue.body || "내용이 없습니다.");
                loadUtterances(id);

            } catch (e) {
                document.getElementById('post-title').innerText = "접근 제한 (403 Error)";
                document.getElementById('content').innerHTML = "<p style='color:#e74c3c;'>GitHub API 호출 한도가 초과되었거나 글을 찾을 수 없습니다. 약 1시간 뒤에 다시 시도해주세요.</p>";
                console.error(e);
            }
        }

        function loadUtterances(issueNumber) {
            const container = document.getElementById('utterances-container');
            const script = document.createElement('script');
            
            script.src = "https://utteranc.es/client.js";
            script.setAttribute("repo", `${OWNER}/${REPO}`);
            script.setAttribute("issue-number", issueNumber);
            script.setAttribute("theme", "github-light");
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;
            
            container.innerHTML = '';
            container.appendChild(script);
        }

        loadPost();
    </script>
</body>
</html>
