<style>
    :root { --primary-color: #2980b9; --text-color: #222; --bg-color: #f4f7f6; --card-bg: #ffffff; }
    body { font-family: 'Segoe UI', Apple SD Gothic Neo, sans-serif; line-height: 1.8; color: var(--text-color); max-width: 900px; margin: 0 auto; padding: 40px 20px; background-color: var(--bg-color); word-break: break-word; }
    .nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .nav a { text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 0.95rem; }
    
    article { background: var(--card-bg); padding: 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; }
    .post-title { color: #111; font-size: 2.4rem; margin-top: 0; margin-bottom: 15px; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all; }
    .meta { color: #7f8c8d; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 25px; margin-bottom: 35px; }
    
    #content { font-size: 1.1rem; color: #222; }
    #content p { margin-bottom: 1.5em; }
    #content img { max-width: 100%; border-radius: 8px; height: auto; display: block; margin: 25px auto; }
    #content code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    #content pre { background: #2d3436; color: #dfe6e9; padding: 20px; border-radius: 8px; overflow-x: auto; font-size: 0.9em; }
    #content blockquote { border-left: 4px solid var(--primary-color); margin: 0 0 1.5em 0; padding: 10px 20px; color: #555; background: #f9f9f9; }
    
    .comments-section { background: var(--card-bg); padding: 40px 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 60px; }
    .comments-header { font-size: 1.5rem; color: #2c3e50; border-bottom: 2px solid var(--bg-color); padding-bottom: 15px; margin-top: 0; margin-bottom: 30px; }
    .utterances { max-width: 100% !important; width: 100% !important; }

    /* 모바일 극강의 가독성 최적화 (종이책/브런치 스타일) */
    @media (max-width: 768px) {
        body { padding: 15px; background-color: #ffffff; }
        
        /* 모바일에서는 Article의 박스, 그림자 제거하고 화면 전체를 여백으로 사용 */
        article { padding: 10px 0 30px 0; box-shadow: none; border-radius: 0; background: transparent; margin-bottom: 20px; }
        
        .post-title { font-size: 1.7rem; margin-bottom: 10px; }
        .meta { padding-bottom: 15px; margin-bottom: 25px; font-size: 0.9rem; }
        
        /* 폰트 크기 및 줄 간격을 읽기 가장 편안한 사이즈로 조정 */
        #content { font-size: 1.15rem; line-height: 1.85; letter-spacing: -0.01em; color: #1a1a1a; }
        
        #content pre { padding: 15px; border-radius: 6px; font-size: 0.85rem; }
        #content blockquote { padding: 10px 15px; }
        
        /* 댓글 섹션도 테두리 제거 */
        .comments-section { padding: 20px 0; box-shadow: none; background: transparent; border-top: 1px solid #eee; border-radius: 0; }
    }
</style>
