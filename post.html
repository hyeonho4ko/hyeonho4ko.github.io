<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry's Archive - View Post</title>
    <!-- 마크다운을 HTML로 변환해주는 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 코드 하이라이팅 (파이썬 등 코드를 예쁘게) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 40px 20px; background-color: #f4f7f6; }
        header { text-align: center; margin-bottom: 40px; }
        .back-link { text-decoration: none; color: #2980b9; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        .post-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1#post-title { color: #2c3e50; font-size: 2.2rem; margin-top: 0; line-height: 1.3; }
        .post-meta { color: #999; font-size: 0.9rem; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        #post-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
        #post-content pre { background: #f0f0f0; padding: 15px; border-radius: 8px; overflow-x: auto; }
        #post-content blockquote { border-left: 5px solid #2980b9; margin: 0; padding-left: 20px; color: #555; font-style: italic; }
        .loading { text-align: center; font-size: 1.2rem; color: #666; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to Dashboard</a>

    <div id="loading" class="loading">Loading the professional insights...</div>

    <article class="post-container" id="post-view" style="display:none;">
        <h1 id="post-title"></h1>
        <div class="post-meta">Published by Henry on <span id="post-date"></span></div>
        <div id="post-content"></div>
    </article>

    <script>
        // 1. URL에서 issue 번호 가져오기 (예: post.html?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const issueId = urlParams.get('id');
        
        // 내 GitHub 정보 설정
        const repo = "hyeonho4ko/hyeonho4ko.github.io";

        if (issueId) {
            fetch(`https://api.github.com/repos/${repo}/issues/${issueId}`)
                .then(response => {
                    if (!response.ok) throw new Error("Post not found");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('post-view').style.display = 'block';
                    
                    // 제목과 날짜 넣기
                    document.getElementById('post-title').innerText = data.title;
                    const date = new Date(data.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    document.getElementById('post-date').innerText = date;

                    // 마크다운 본문을 HTML로 변환하여 넣기
                    document.getElementById('post-content').innerHTML = marked.parse(data.body);
                    
                    // 코드 하이라이팅 적용
                    hljs.highlightAll();
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Error: Could not load the post.";
                    console.error(err);
                });
        } else {
            document.getElementById('loading').innerText = "No post ID specified.";
        }
    </script>
</body>
</html>
