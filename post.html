<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Hyeonho's Archive</title>
    <!-- 마크다운 변환 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; line-height: 1.8; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .nav { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav a { text-decoration: none; color: #2980b9; font-weight: bold; }
        
        article { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .post-title { color: #2c3e50; font-size: 2rem; margin-top: 0; margin-bottom: 10px; line-height: 1.3; }
        .meta { color: #7f8c8d; font-size: 0.9rem; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        #content img { max-width: 100%; border-radius: 8px; }
        
        /* 댓글 영역 스타일 */
        .comments-section { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .comments-header { font-size: 1.4rem; color: #2c3e50; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">← Home</a>
        <a href="javascript:history.back()">Back to List</a>
    </div>

    <!-- 본문 영역 -->
    <article>
        <h1 id="post-title" class="post-title">Loading post...</h1>
        <div id="post-meta" class="meta">Date</div>
        <div id="content"></div>
    </article>

    <!-- 댓글 창이 생성될 영역 -->
    <div class="comments-section">
        <h3 class="comments-header">Comments</h3>
        <div id="utterances-container">
            <!-- 자바스크립트를 통해 여기에 댓글창이 생성됩니다 -->
        </div>
    </div>

    <script>
        const OWNER = 'hyeonho4ko';
        const REPO = 'hyeonho4ko.github.io';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadPost() {
            try {
                // 1. 본문 데이터 가져오기
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues/${id}`);
                const issue = await response.json();

                document.title = issue.title;
                document.getElementById('post-title').innerText = issue.title;
                document.getElementById('post-meta').innerText = `Posted on ${new Date(issue.created_at).toLocaleDateString()}`;
                document.getElementById('content').innerHTML = marked.parse(issue.body || "내용이 없습니다.");

                // 2. 현재 글(Issue)에 해당하는 Utterances 댓글창 생성
                loadUtterances(id);

            } catch (e) {
                document.getElementById('content').innerText = "글을 불러올 수 없습니다.";
            }
        }

        function loadUtterances(issueNumber) {
            const container = document.getElementById('utterances-container');
            
            // Utterances 스크립트 태그 동적 생성
            const script = document.createElement('script');
            script.src = "https://utteranc.es/client.js";
            script.setAttribute("repo", `${OWNER}/${REPO}`);
            script.setAttribute("issue-number", issueNumber); // 현재 표시중인 이슈 번호와 연결
            script.setAttribute("theme", "github-light"); // 테마 설정
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;

            // 컨테이너에 스크립트 추가 (자동으로 댓글창 iframe 생성됨)
            container.appendChild(script);
        }

        if (id) loadPost();
    </script>
</body>
</html>
